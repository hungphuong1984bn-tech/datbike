name: mybike_app
description: "My Bike App — Smart electric vehicle dashboard and controller."
publish_to: 'none'
version: 2.8.0+53
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.14
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  http: ^1.6.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^10.0.0
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#0B0F17"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

