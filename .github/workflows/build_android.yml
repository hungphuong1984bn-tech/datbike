name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại bản build'
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  # Gắn tag dạng v2.7.0 để tự tạo GitHub Release kèm APK
  create:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      # Phân tích + test chỉ cảnh báo, không chặn build APK.
      # Đọc log của 2 bước này để biết có lỗi cần sửa không.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        continue-on-error: true
        run: flutter test

      - name: Build APK (release, tách theo ABI)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: flutter build apk --release --split-per-abi

      - name: Build APK (debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: Đổi tên APK theo version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f" .apk)
            cp "$f" "dist/MyBike-${VERSION}-${base#app-}.apk"
          done
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBike-Android-APK
          path: dist/*.apk
          retention-days: 30

      - name: Tạo GitHub Release (khi push tag v*)
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
